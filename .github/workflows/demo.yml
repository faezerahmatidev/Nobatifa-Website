name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Public demo on GitHub Pages (static hosting, no server).
# Built with the development configuration so the dev-only 1111 login
# bypass stays active for trying the full flow without real SMS.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration development --base-href /Nobatifa-Website/
      - run: cp dist/Nobatifa-Website/browser/index.html dist/Nobatifa-Website/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/Nobatifa-Website/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
